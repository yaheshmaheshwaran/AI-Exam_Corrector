<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Exam Corrector, "Marked as Read": an answer sheet under a reading beam.
       Above the beam the lines are read and ticked in the margin; below it the
       handwriting is still waiting. Source for every app icon and in-app logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="1" stop-color="#F1EBE3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7AF61" stop-opacity="0"/>
      <stop offset="1" stop-color="#E7AF61" stop-opacity=".5"/>
    </linearGradient>
    <clipPath id="edge">
      <rect width="100" height="100" rx="23"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#tile)"/>
  <g clip-path="url(#edge)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Margin rule -->
    <path d="M32 0 V100" stroke="#993324" stroke-width="3"/>
    <!-- Read: typed lines, ticked in the margin -->
    <path d="M40 20 H84 M40 35 H74" stroke="#3E2F23" stroke-width="4.5"/>
    <path d="M9 20 L15.4 26.4 L25 11.2 M9 35 L15.4 41.4 L25 26.2" stroke="#4E7951" stroke-width="5"/>
    <!-- Not yet read: handwriting -->
    <path d="M40 64 q3 -7 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0" stroke="#3E2F23" stroke-width="4.5"/>
    <path d="M40 80 q3 -7 6 0 t6 0 t6 0 t6 0 t6 0" stroke="#3E2F23" stroke-width="4.5"/>
    <!-- Reading beam -->
    <rect x="0" y="32" width="100" height="18" fill="url(#glow)" stroke="none"/>
    <path d="M0 50 H100" stroke="#E3A248" stroke-width="4"/>
  </g>
  <rect x=".5" y=".5" width="99" height="99" rx="22.5" fill="none" stroke="#000000" stroke-opacity=".08"/>
</svg>
