name: exam_corrector
description: "Understands and marks handwritten exam scripts against their question paper."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # PDF text extraction. Pure Dart, so it runs on the Windows target with no
  # native plugin and can be moved onto a background isolate.
  syncfusion_flutter_pdf: ^34.2.3

  # Native file open dialog. Federated; file_selector_windows backs the
  # Windows implementation.
  file_selector: ^1.0.3

  # Transport for the Anthropic Messages API. There is no official Anthropic
  # Dart SDK, so the service layer speaks the REST API directly.
  http: ^1.6.0

  # Content hashes for documents and cache keys. Already present through the
  # PDF dependency; declared because the application uses it directly.
  crypto: ^3.0.6

  # Reading syllabi saved as Word (.docx): a zip of XML. Pure Dart; xml is
  # already present through the PDF dependency.
  archive: ^4.0.9
  xml: ^7.0.1
  desktop_drop: ^0.8.4
  sqlite3: ^3.5.2
  supabase: ^2.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The app's seven short sounds, synthesised for it (160 KB together). The
  # opening chime is made by tool/make_welcome_sound.dart.
  assets:
    - assets/sounds/

  # Plus Jakarta Sans (SIL Open Font License, assets/fonts/OFL.txt). Bundled,
  # so the first frame never waits on a download.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
